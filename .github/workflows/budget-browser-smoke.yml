name: Budget browser smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budget-browser-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build Vite app
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke at mobile, tablet and desktop widths
        run: node tests/budgetBrowserSmoke.mjs
      - name: Upload screenshots when available
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: budget-browser-screenshots
          path: artifacts/budget-browser/
          if-no-files-found: ignore
