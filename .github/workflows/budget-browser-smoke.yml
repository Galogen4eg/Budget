name: Budget browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/budgetBrowserSmoke.mjs'
      - '.github/workflows/budget-browser-smoke.yml'
  workflow_dispatch:

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Vite app
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke at mobile, tablet and desktop widths
        run: node tests/budgetBrowserSmoke.mjs
      - name: Upload screenshots when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-browser-screenshots
          path: artifacts/budget-browser/
          if-no-files-found: ignore
