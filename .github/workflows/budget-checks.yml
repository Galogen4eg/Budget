name: Budget checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budget-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      # Fast independent gate: critical finance invariants and CI configuration.
      # Budget CI/check owns the full test suite, TypeScript and Vite build.
      - name: Critical financial and CI regressions
        run: node --experimental-strip-types --test tests/ciWorkflowGuard.test.mjs tests/budgetFinancialMath.test.mjs tests/familyBudgetProjection.test.mjs tests/calendarMonthNavigation.test.mjs
