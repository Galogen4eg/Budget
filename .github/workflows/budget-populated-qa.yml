name: Budget populated QA seed
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write synthetic data to the existing isolated QA family (unchecked = dry run)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: budget-production-qa
  cancel-in-progress: false
jobs:
  seed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test tests/realisticFamilyFixtures.test.mjs tests/qaSeedSafety.test.mjs && node --check tests/seedPopulatedProductionQa.mjs
      - name: Seed or preview isolated populated family
        env:
          QA_EMAIL_1: ${{ secrets.QA_EMAIL_1 }}
          QA_PASSWORD_1: ${{ secrets.QA_PASSWORD_1 }}
          QA_FAMILY_ID: ${{ secrets.QA_FAMILY_ID }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            node tests/seedPopulatedProductionQa.mjs --apply
          else
            node tests/seedPopulatedProductionQa.mjs
          fi
