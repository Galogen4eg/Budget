name: Budget production QA access
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/productionQaAccess.mjs'
      - 'tests/productionTransactionCrud.mjs'
      - 'tests/productionNavigation.mjs'
      - 'tests/productionModulesCrud.mjs'
      - '.github/workflows/budget-production-qa-access.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: budget-production-qa
  cancel-in-progress: false
jobs:
  validate-scripts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate production QA scripts without connecting to Firebase
        run: node --check tests/productionQaAccess.mjs && node --check tests/productionTransactionCrud.mjs && node --check tests/productionNavigation.mjs && node --check tests/productionModulesCrud.mjs
  read-only-access:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check production QA script syntax
        run: node --check tests/productionQaAccess.mjs && node --check tests/productionModulesCrud.mjs && node --check tests/productionTransactionCrud.mjs && node --check tests/productionNavigation.mjs
      - name: Verify secrets and read-only production access
        id: access
        env:
          QA_EMAIL_1: ${{ secrets.QA_EMAIL_1 }}
          QA_PASSWORD_1: ${{ secrets.QA_PASSWORD_1 }}
          QA_FAMILY_ID: ${{ secrets.QA_FAMILY_ID }}
        run: node tests/productionQaAccess.mjs
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        id: chromium
        run: npx playwright install --with-deps chromium
      - name: Verify production transaction CRUD in isolated QA family
        env:
          QA_EMAIL_1: ${{ secrets.QA_EMAIL_1 }}
          QA_PASSWORD_1: ${{ secrets.QA_PASSWORD_1 }}
          QA_FAMILY_ID: ${{ secrets.QA_FAMILY_ID }}
        run: node tests/productionTransactionCrud.mjs
      - name: Verify production navigation across all six sections and settings
        env:
          QA_EMAIL_1: ${{ secrets.QA_EMAIL_1 }}
          QA_PASSWORD_1: ${{ secrets.QA_PASSWORD_1 }}
          QA_FAMILY_ID: ${{ secrets.QA_FAMILY_ID }}
        run: node tests/productionNavigation.mjs
      - name: Verify additional authenticated modules on actual production
        env:
          QA_EMAIL_1: ${{ secrets.QA_EMAIL_1 }}
          QA_PASSWORD_1: ${{ secrets.QA_PASSWORD_1 }}
          QA_FAMILY_ID: ${{ secrets.QA_FAMILY_ID }}
        run: node tests/productionModulesCrud.mjs
