name: Photo Curator Timer

on:
  schedule:
    # Запуск в 10:00, 15:00, 19:00 по Москве (8:00, 12:00, 16:00 UTC)
    - cron: '0 7,12,16 * * *'
  workflow_dispatch:

jobs:
  trigger-curator:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel Endpoint
        run: |
          curl -X GET "https://${{ secrets.VERCEL_PROJECT_URL }}/api/curator-photo" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
