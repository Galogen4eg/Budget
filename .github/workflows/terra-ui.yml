name: Terra UI catalog

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --prefer-offline --no-audit --no-fund
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium
      - name: Check catalog and capture screenshots
        shell: bash
        run: |
          npx vite preview --outDir storybook-static --host 127.0.0.1 --port 6006 --strictPort > /tmp/terra-storybook.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6006/iframe.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:6006/iframe.html >/dev/null
          npm run check:terra-ui
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: terra-ui-screenshots
          path: terra-ui-screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: terra-storybook-static
          path: storybook-static/
          if-no-files-found: error
