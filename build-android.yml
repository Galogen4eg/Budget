
name: 2. Build Android APK (Simple)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # === ВАЖНЫЙ ЭТАП: ВОССТАНОВЛЕНИЕ ПОСТОЯННОГО КЛЮЧА ===
      - name: Restore Keystore from Secrets
        id: restore_key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "✅ Found secret key! Decoding..."
            # Создаем папку .android в домашней директории, куда Gradle смотрит по умолчанию
            mkdir -p ~/.android/
            # Декодируем секрет и перезаписываем стандартный debug.keystore
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "✅ Permanent keystore restored to ~/.android/debug.keystore"
          else
            echo "⚠️ No secret key found. Generating a new temporary one (SHA-1 will change!)."
          fi

      - name: Install Dependencies
        run: npm install

      # Добавлен проброс API ключа
      - name: Build Web App
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Initialize Capacitor Android
        run: |
          npx cap add android
          npx cap sync

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Выводим SHA-1 текущей сборки (для проверки)
      - name: 👇 CURRENT BUILD SHA-1 👇
        run: |
          cd android
          ./gradlew signingReport

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyBudget-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5
